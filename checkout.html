
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | UniCanteen</title>

    <link rel="stylesheet" href="/src/style.css">
</head>

<body>

    <!-- Navigation bar -->
    <header class="navbar">
        <a href="/" class="logo">Uni<span>Canteen</span></a>

        <nav class="nav-links">
            <a href="/">Home</a>
            <a href="/canteens.html">Menu</a>
            <a href="/cart.html" class="nav-cart-link">
                My Cart <span class="cart-count">0</span>
            </a>
        </nav>

        <a href="/login.html" class="login-button">
            Student Sign In
        </a>
    </header>


    <!-- Checkout content -->
    <main class="checkout-page">

        <section class="checkout-heading">
            <h1>Checkout</h1>
            <p>Review your order before proceeding.</p>
        </section>

<section class="student-details">

    <h2>Student Details</h2>
    <p>Please provide your details for this order.</p>

    <div class="student-form">

        <div class="form-group">
            <label for="student-name">Full Name</label>
            <input
                type="text"
                id="student-name"
                placeholder="Enter your full name"
                required
            >
        </div>

        <div class="form-group">
            <label for="registration-number">
                University Registration Number
            </label>
            <input
                type="text"
                id="registration-number"
                placeholder="Enter your registration number"
                required
            >
        </div>

    </div>

</section>


<!-- Payment Method -->
<section class="payment-section">

    <h2>Payment Method</h2>
    <p>Choose how you would like to pay for your order.</p>

    <div class="payment-options">

        <label class="payment-option">
            <input
                type="radio"
                name="payment-method"
                value="cash"
            >
            <div>
                <h3>💵 Cash on Collection</h3>
                <p>Pay when you collect your meal.</p>
            </div>
        </label>

        <label class="payment-option">
            <input
                type="radio"
                name="payment-method"
                value="bank-transfer"
            >
            <div>
                <h3>🏦 Bank Transfer</h3>
                <p>Pay through a bank transfer.</p>
            </div>
        </label>

        <label class="payment-option">
            <input
                type="radio"
                name="payment-method"
                value="card"
            >
            <div>
                <h3>💳 Card Payment</h3>
                <p>Pay using a debit or credit card.</p>
            </div>
        </label>

    </div>

    <!-- Dynamic payment information -->
    <div id="payment-details" class="payment-details" aria-live="polite">
    </div>

</section>


</body>
</html>
