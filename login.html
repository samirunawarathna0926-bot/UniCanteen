
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | UniCanteen</title>

    <link rel="stylesheet" href="/src/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header class="navbar">

        <a href="/" class="logo">
            Uni<span>Canteen</span>
        </a>

        <nav class="nav-links">
            <a href="/">Home</a>
            <a href="/canteens.html">Menu</a>

            <a href="/cart.html" class="nav-cart-link">
                My Cart <span class="cart-count">0</span>
            </a>
        </nav>

    </header>


    <!-- Authentication Page -->
    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-heading">

                <h1>Welcome to UniCanteen</h1>

                <p>
                    Sign in or create an account to enjoy easier ordering.
                </p>

            </div>


            <!-- Login and Register Tabs -->
            <div class="auth-tabs">

                <button type="button"
                        id="login-tab"
                        class="auth-tab active">
                    Login
                </button>

                <button type="button"
                        id="register-tab"
                        class="auth-tab">
                    Register
                </button>

            </div>


            <!-- LOGIN FORM -->
            <form id="login-form">

                <h2>Student Login</h2>

                <div class="form-group">

                    <label for="login-email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        placeholder="Enter your email address"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="login-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="login-password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button type="submit" class="auth-submit-button">
                    Login
                </button>

                <p class="auth-switch-text">
                    Don't have an account?

                    <button type="button" id="show-register">
                        Register here
                    </button>
                </p>

            </form>


            <!-- REGISTRATION FORM -->
            <form id="register-form" hidden>

                <h2>Create Your Account</h2>

                <div class="form-group">

                    <label for="register-name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="register-name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="register-number">
                        University Registration Number
                    </label>

                    <input
                        type="text"
                        id="register-number"
                        placeholder="Enter your registration number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="register-email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="register-email"
                        placeholder="Enter your email address"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="register-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="register-password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Enter your password again"
                        minlength="6"
                        required
                    >

                </div>


                <button type="submit" class="auth-submit-button">
                    Create Account
                </button>

                <p class="auth-switch-text">
                    Already have an account?

                    <button type="button" id="show-login">
                        Login here
                    </button>
                </p>

            </form>

        </section>

    </main>


    <footer class="footer">

        <a href="/" class="logo">
            Uni<span>Canteen</span>
        </a>

        <p>Making university dining easier.</p>

        <p>© 2026 UniCanteen. All rights reserved.</p>

    </footer>


    <script type="module" src="/src/cart-count.js"></script>
    <script type="module" src="/src/auth.js"></script>

</body>
</html>
